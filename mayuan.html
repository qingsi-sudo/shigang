<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="考研政治马原原理动画：51 个原理的分步机制动画，带必背分级、挖空、连播和闯关。"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}.swt{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden;flex:none}.swt a,.swt span{padding:5px 12px;font-size:13px;font-weight:700;text-decoration:none;color:var(--fg2);white-space:nowrap}.swt span{background:var(--gold);color:var(--ink)}.swt a:hover{background:var(--raise);color:var(--fg)}</style></head><body>
<title>马原原理动画</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：顶栏 / 左侧目录 + 中间动画舞台 + 右侧原理卡。与史纲地图同一套深色“夜图”风格，刻意单主题。 */
:root{
  color-scheme:dark;
  --ink:#0e1013; --stage:#121519; --panel:#15181d; --raise:#1c2026; --line:#2a2f37; --line2:#363c46;
  --fg:#ece6d8; --fg2:#bdb6a6; --muted:#857f72;
  --gold:#e0a84e; --red:#de5a43; --blue:#79acd9; --jade:#5fbf9d;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:grid;grid-template-columns:250px minmax(0,1fr) 390px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top top" "nav stage side"}
.top{grid-area:top;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-weight:900;font-size:17px;letter-spacing:.06em;white-space:nowrap}
.brand i{font-style:normal;color:var(--gold)}
.search{position:relative;flex:0 1 240px;min-width:150px}
.search input{width:100%;box-sizing:border-box;background:var(--raise);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:7px 10px;font:inherit;font-size:13px}
.search input::placeholder{color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:0 18px 40px rgba(0,0,0,.5);max-height:60vh;overflow:auto;z-index:30;padding:4px}
.results button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:5px;cursor:pointer;font-size:13px}
.results button:hover{background:var(--raise)}
.results small{color:var(--muted);margin-right:8px}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:6px;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;color:var(--fg2);white-space:nowrap}
.tog[aria-pressed=true],.tog[data-lv="2"],.tog[data-lv="3"]{border-color:var(--gold);color:var(--gold);background:rgba(224,168,78,.08)}
.tog.hot{color:var(--fg);border-color:var(--line2);font-weight:500}
.tog .dot{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.tog[aria-pressed=true] .dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
/* 目录 */
.nav{grid-area:nav;border-right:1px solid var(--line);overflow:auto;padding:10px 8px 20px;min-height:0;overscroll-behavior:contain}
.nav h4{margin:14px 8px 6px;font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between}
.nav h4 span{letter-spacing:0;font-weight:400;font-variant-numeric:tabular-nums}
.ni{display:flex;align-items:baseline;gap:6px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;font-size:13px;color:var(--fg2);line-height:1.45}
.ni:hover{background:var(--raise);color:var(--fg)}
.ni.on{background:var(--raise);color:var(--fg);box-shadow:inset 2px 0 0 var(--gold)}
.ni .st{flex:none;width:12px;color:var(--gold);font-size:11px}
.ni.lv3{color:var(--fg);font-weight:500}
.ni.lv1{opacity:.6}
.ni .rd{margin-left:auto;color:var(--jade);font-size:11px}
/* 舞台 */
.stage{grid-area:stage;display:flex;flex-direction:column;min-height:0;min-width:0;background:radial-gradient(ellipse at 50% 40%,#171b21 0%,var(--stage) 60%,var(--ink) 100%);position:relative}
.sthead{padding:16px 22px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sthead .chn{font-size:12px;color:var(--gold);letter-spacing:.14em;font-weight:700}
.sthead h1{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(22px,2.6vw,32px);line-height:1.25;letter-spacing:.02em;text-wrap:balance}
.lvtag{font-size:12px;border-radius:4px;padding:1px 8px;font-weight:700;white-space:nowrap}
.lvtag.l3{background:var(--gold);color:var(--ink)} .lvtag.l2{border:1px solid var(--gold);color:var(--gold)} .lvtag.l1{border:1px solid var(--line2);color:var(--muted)}
.svgwrap{flex:1;min-height:0;display:grid;place-items:center;padding:6px 14px;cursor:pointer}
#sv{width:100%;height:100%;max-height:100%;display:block}
.cap{min-height:54px;margin:0 22px;padding:10px 14px;border-left:3px solid var(--gold);background:rgba(21,24,29,.8);border-radius:0 6px 6px 0;font-size:16px;font-weight:500;line-height:1.55;display:flex;align-items:center}
.cap b{color:var(--gold);margin-right:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctl{display:flex;align-items:center;gap:8px;padding:12px 22px max(14px,env(safe-area-inset-bottom,0px))}
.ctl button{background:var(--raise);border:1px solid var(--line2);border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px;color:var(--fg2)}
.ctl button:hover{color:var(--fg);border-color:var(--muted)}
.ctl button.pri{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.dots{display:flex;gap:5px;margin:0 6px}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--line2);transition:background .3s}
.dots i.on{background:var(--gold)}
.ctl .sp{margin-left:auto;font-size:12px;color:var(--muted)}
/* SVG 元素 */
#sv text{font-family:var(--sans)}
#sv [data-s]{opacity:0;transition:opacity .55s ease,transform .55s cubic-bezier(.2,1.2,.4,1)}
#sv [data-s].on{opacity:1}
#sv .pop{transform-box:fill-box;transform-origin:center;transform:scale(.7)}
#sv .pop.on{transform:scale(1)}
#sv .rise{transform:translateY(16px)} #sv .rise.on{transform:none}
#sv .draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1s ease,opacity .2s}
#sv .draw.on{stroke-dashoffset:0}
#sv .bx{fill:var(--panel);stroke-width:1.6}
#sv .t1{font-weight:700;fill:var(--fg);text-anchor:middle;dominant-baseline:central}
#sv .t2{fill:var(--fg2);text-anchor:middle;dominant-baseline:central}
#sv .lb{font-weight:700;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--stage);stroke-width:5px;stroke-linejoin:round}
#sv .end{font-family:var(--serif);font-weight:900;fill:var(--gold);text-anchor:middle;dominant-baseline:central}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.25}50%{opacity:.9}}
#sv .glow.on{animation:glow 1.6s ease-in-out infinite}
/* 原理卡 */
.side{grid-area:side;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.card{flex:1;overflow:auto;padding:18px 22px 12px;min-height:0;overscroll-behavior:contain}
.acts{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:4px}
.acts button{background:none;border:0;border-right:1px solid var(--line);padding:8px 4px;font-size:12.5px;color:var(--fg2);cursor:pointer}
.acts button:last-child{border-right:0}
.acts button:hover{background:var(--raise);color:var(--fg)}
.acts button[aria-pressed=true]{color:var(--gold)}
.sec{padding:14px 0 8px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--gold)}
.sec h3.r{color:var(--red)} .sec h3.b{color:var(--blue)} .sec h3.j{color:var(--jade)}
.sec p{margin:0;font-size:14.5px;line-height:1.85}
mark{background:none;color:var(--gold);font-weight:700;border-bottom:1px solid rgba(224,168,78,.4);padding:0 1px}
.blank mark{color:transparent;background:rgba(224,168,78,.16);border-radius:3px;border-bottom-color:var(--gold);cursor:pointer;user-select:none}
.blank mark.show{color:var(--gold);background:none}
.errbox{background:rgba(222,90,67,.08);border:1px solid rgba(222,90,67,.3);border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.75}
.exs{display:grid;gap:6px}
.ex{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--raise);border-radius:6px;padding:8px 11px;font-size:13.5px}
.ex span{color:var(--jade);font-size:12.5px;text-align:right}
.blank .ex span{color:transparent;background:rgba(95,191,157,.14);border-radius:3px;cursor:pointer}
.blank .ex span.show{color:var(--jade);background:none}
.tmpl{font-size:13px;color:var(--fg2);line-height:1.8;background:var(--raise);border-radius:6px;padding:10px 12px}
.tmpl b{color:var(--fg)}
.nav2{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.nav2 button{background:none;border:0;text-align:left;padding:11px 18px;cursor:pointer;min-width:0}
.nav2 button+button{border-left:1px solid var(--line);text-align:right}
.nav2 button:hover{background:var(--raise)}
.nav2 button:disabled{opacity:.35;cursor:default;background:none}
.nav2 small{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em}
.nav2 span{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src{padding:9px 22px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.src b{color:var(--fg);font-weight:500}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card.anim>*{animation:rise .45s ease-out both}
.card.anim>*:nth-child(2){animation-delay:.08s}.card.anim>*:nth-child(3){animation-delay:.16s}.card.anim>*:nth-child(4){animation-delay:.24s}.card.anim>*:nth-child(n+5){animation-delay:.32s}
/* 闯关 */
.qz .qh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.qz .qh b{color:var(--gold)}
.qz .bar{height:3px;background:var(--line);border-radius:2px;margin:8px 0 16px;overflow:hidden}
.qz .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .4s}
.qz .qt{font-size:12px;letter-spacing:.16em;color:var(--blue);font-weight:700}
.qz .qq{font-family:var(--serif);font-weight:900;font-size:21px;line-height:1.5;margin:8px 0 14px;text-wrap:balance}
.qz .clue{background:var(--raise);border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.75;margin-bottom:14px}
.qz .opts{display:grid;gap:8px}
.qz .opt{display:flex;gap:10px;align-items:center;text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:11px 12px;cursor:pointer;font-size:14.5px}
.qz .opt .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--panel);color:var(--muted);border:1px solid var(--line2)}
.qz .opt.ok{border-color:var(--jade);background:rgba(95,191,157,.1)}
.qz .opt.bad{border-color:var(--red);background:rgba(222,90,67,.1)}
.qz .fb{margin-top:14px;border-radius:7px;padding:12px 13px;font-size:14px;line-height:1.7;animation:rise .35s ease-out both}
.qz .fb.ok{background:rgba(95,191,157,.1);border:1px solid rgba(95,191,157,.4)}
.qz .fb.bad{background:rgba(222,90,67,.08);border:1px solid rgba(222,90,67,.35)}
.qz .fb b.v{display:block;font-size:15px;margin-bottom:4px}
.qz .fb.ok b.v{color:var(--jade)} .qz .fb.bad b.v{color:var(--red)}
.qz .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.qz .btn{flex:1;min-width:110px;background:var(--raise);border:1px solid var(--line2);border-radius:7px;padding:10px;cursor:pointer;font-size:14px}
.qz .btn.pri{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.qz .btn:disabled{opacity:.4;cursor:default}
.qz .big{font-family:var(--serif);font-weight:900;font-size:58px;line-height:1;color:var(--gold)}
.qz .big small{font-size:20px;color:var(--fg2)}
.qz p{color:var(--fg2);font-size:14px;line-height:1.75;margin:8px 0}
.qz .list{display:grid;gap:2px}
.qz .list button{text-align:left;background:none;border:0;border-radius:4px;padding:6px;cursor:pointer;font-size:13.5px;color:var(--fg2)}
.qz .list button:hover{background:var(--raise);color:var(--fg)}
.app.quizzing .nav{opacity:.3;pointer-events:none}
.app.quizzing .nav2{display:none}
/* 窄屏 */
@media (max-width:1100px){.app{grid-template-columns:210px minmax(0,1fr) 340px}}
@media (max-width:900px){
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "nav" "stage" "side"}
  .nav{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px max(14px,env(safe-area-inset-left,0px));align-items:center}
  .nav h4{margin:0 2px 0 8px;white-space:nowrap;flex:none}
  .nav h4 span{display:none}
  .ni{flex:none;width:auto;border:1px solid var(--line);white-space:nowrap}
  .ni.on{box-shadow:none;border-color:var(--gold)}
  .ni .rd{margin-left:4px}
  .svgwrap{min-height:0;padding:4px 6px}
  #sv{height:auto;aspect-ratio:800/430}
  .side{border-left:0;border-top:1px solid var(--line)}
  .card{overflow:visible}
  .tools{margin-left:0}
  .cap{font-size:14.5px;margin:0 14px}
  .sthead{padding:12px 14px 0}
  .ctl{padding:10px 14px 12px;flex-wrap:wrap}
  .ctl .sp{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="swt" role="navigation" aria-label="切换主题"><a href="./">史纲地图</a><span>马原动画</span></div>
    <div class="brand">考研政治<i> · </i>马原原理动画</div>
    <div class="search"><input id="q" type="search" placeholder="搜原理、成语、关键词…" autocomplete="off" aria-label="搜索"><div class="results" id="res" hidden></div></div>
    <div class="tools">
      <button class="tog hot" id="tQuiz" aria-pressed="false">闯关测验</button>
      <button class="tog" id="tLv" title="按重要度筛选">全部原理</button>
      <button class="tog" id="tBlank" aria-pressed="false" title="把关键词挖空，点一下显示（B）"><span class="dot"></span>挖空</button>
      <button class="tog" id="tPlay" aria-pressed="false" title="自动播完一个接下一个（空格）"><span class="dot"></span>连播</button>
    </div>
  </header>
  <nav class="nav" id="nav" aria-label="原理目录"></nav>
  <section class="stage">
    <div class="sthead"><span class="chn" id="chn"></span><h1 id="ttl"></h1><span class="lvtag" id="lvt"></span></div>
    <div class="svgwrap" id="wrap" title="点击画面进入下一步"><svg id="sv" viewBox="0 0 800 430" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div class="cap" id="cap"></div>
    <div class="ctl"><button id="cPrev">◀ 上一步</button><button class="pri" id="cNext">下一步 ▶</button><div class="dots" id="dots"></div><button id="cRe">↻ 重播</button><span class="sp">点画面或按 → 进入下一步</span></div>
  </section>
  <aside class="side">
    <div class="card" id="card"></div>
    <div class="nav2"><button id="bPrev"><small>上一个 ↑</small><span></span></button><button id="bNext"><small>↓ 下一个</small><span></span></button></div>
    <div class="src">已掌握 <b id="nRead">0</b>/<span id="nAll"></span> · 记录只存在这台设备的浏览器里</div>
  </aside>
</div>

<script>
/* 马原原理数据：ch 章；lv 3 必背 / 2 重要 / 1 了解；a 动画；yl 原理；ff 方法论；err 易错；ex 例子[名称,说明] */
const CH=['唯物论','辩证法','认识论','唯物史观','政治经济学','科学社会主义'];
const D=[
/* ============ 唯物论 ============ */
{ch:0,t:'哲学基本问题',lv:2,a:{type:'tree',root:'思维和存在的关系',kids:[{n:'何者为第一性',sub:'划分唯物、唯心',kids:['唯物主义：存在第一性','唯心主义：思维第一性']},{n:'有无同一性',sub:'划分可知、不可知',kids:['可知论','不可知论']}],end:'两个方面，各管一条分界线'},
 yl:'哲学基本问题是==思维和存在的关系==问题。第一方面：何者为==第一性==，是划分==唯物主义和唯心主义==的唯一标准；第二方面：思维和存在有无==同一性==，是划分==可知论和不可知论==的标准。',
 ff:'判断一个观点属于哪一派，先看它回答的是“谁决定谁”，还是“能不能认识”。',
 err:'划分唯物、唯心的==唯一标准==是第一性问题；辩证法与形而上学的分歧不属于哲学基本问题。',
 ex:[['“心外无物”','主观唯心主义'],['“理在事先”','客观唯心主义'],['“气者，理之依也”','唯物主义']]},
{ch:0,t:'物质与意识的辩证关系',lv:3,a:{type:'duo',a:'物质',aSub:'客观实在性',b:'意识',bSub:'人脑对客观世界的反映',ab:'决定',ba:'能动的反作用',abSub:'起源 · 本质 · 内容都依赖物质',baSub:'目的性 · 创造性 · 指导实践 · 调控生理',end:'一切从实际出发 + 发挥主观能动性'},
 yl:'==物质决定意识==：意识是物质世界长期发展的产物，是人脑的机能，是对客观存在的反映。==意识对物质具有能动的反作用==：正确的意识促进事物发展，错误的意识阻碍事物发展。',
 ff:'坚持==一切从实际出发，实事求是==；同时重视意识的作用，==发挥主观能动性==，树立正确的思想意识。',
 err:'意识的能动作用再大，也不能==创造或消灭==物质和规律；承认反作用不是二元论。',
 ex:[['画饼充饥','夸大意识作用'],['巧妇难为无米之炊','物质决定意识'],['胸有成竹','意识的能动性'],['望梅止渴','意识调控生理活动']]},
{ch:0,t:'主观能动性与客观规律性',lv:3,a:{type:'duo',a:'尊重客观规律',aSub:'前提和基础',b:'发挥主观能动性',bSub:'必要条件',ab:'是……的前提',ba:'才能认识和利用',end:'实践是两者统一的基础'},

/* ===== 动画模板：返回 {svg, caps[], onStep?} ，元素用 data-s=步号 控制出现 ===== */
const tw=(s,fs)=>[...String(s)].reduce((a,c)=>a+(c.charCodeAt(0)>255?fs:fs*.56),0);
const fit=(s,w,max)=>Math.max(11,Math.min(max,Math.floor(w/Math.max(1,tw(s,1)))));
function box(x,y,w,h,t,sub,c,s,cls='pop'){const f=fit(t,w-24,24),f2=sub?fit(sub,w-16,13):0;
  return `<g data-s="${s}" class="${cls}"><rect class="bx" x="${x}" y="${y}" width="${w}" height="${h}" rx="12" stroke="${c}"/><rect x="${x}" y="${y}" width="${w}" height="5" rx="2.5" fill="${c}"/>
  <text class="t1" x="${x+w/2}" y="${y+h/2-(sub?10:0)}" font-size="${f}">${esc(t)}</text>${sub?`<text class="t2" x="${x+w/2}" y="${y+h/2+18}" font-size="${f2}">${esc(sub)}</text>`:''}</g>`}
function arrow(d,c,s,id){return `<path id="${id}" data-s="${s}" class="draw" d="${d}" pathLength="1" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" marker-end="url(#ah)" style="color:${c}"/>
  <circle data-s="${s}" r="5" fill="${c}"><animateMotion dur="2.4s" repeatCount="indefinite" rotate="auto"><mpath href="#${id}"/></animateMotion></circle>`}
function label(x,y,t,c,s,fs=17){return `<text data-s="${s}" class="lb rise" x="${x}" y="${y}" font-size="${fs}" fill="${c}">${esc(t)}</text>`}
function note(x,y,t,s,fs=13){return `<text data-s="${s}" class="t2 rise" x="${x}" y="${y}" font-size="${Math.min(fs,fit(t,760,fs))}">${esc(t)}</text>`}
function ending(t,s){return `<g data-s="${s}" class="pop"><rect x="${400-tw(t,fit(t,720,21))/2-22}" y="378" width="${tw(t,fit(t,720,21))+44}" height="40" rx="20" fill="rgba(224,168,78,.1)" stroke="var(--gold)"/><text class="end" x="400" y="398" font-size="${fit(t,720,21)}">${esc(t)}</text></g>`}
const DEFS=`<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="context-stroke"/></marker></defs>`;

function others(d,n=3){return shuffle(D.filter(x=>x.id!==d.id&&x.ch===d.ch)).concat(shuffle(D.filter(x=>x.id!==d.id&&x.ch!==d.ch))).slice(0,n)}
function makeQs(pool){const qs=[];const exs=shuffle(pool.flatMap(d=>(d.ex||[]).map(x=>({d,x}))));const ps=shuffle(pool);let a=0,b=0;
  ['ex','ex','ff','ex','kw','ex','ff','ex','kw','ex'].forEach(ty=>{
    if(ty==='ex'&&exs[a]){const {d,x}=exs[a++];qs.push({ty,d,clue:x[0],q:'这句话 / 这个例子，考的是哪个原理？',opts:shuffle([d,...others(d)])})}
    else{const d=ps[b++%ps.length];if(ty==='ff'&&d.ff)qs.push({ty,d,clue:plain(d.ff),q:'下面的方法论，对应哪个原理？',opts:shuffle([d,...others(d)])});
      else{const ks=[...d.yl.matchAll(/==(.+?)==/g)].map(m=>m[1]);if(ks.length){const k=ks[Math.floor(Math.random()*ks.length)];const alt=shuffle(D.filter(x=>x.id!==d.id).flatMap(x=>[...x.yl.matchAll(/==(.+?)==/g)].map(m=>m[1])).filter(w=>w!==k&&Math.abs(w.length-k.length)<=4&&!ks.includes(w))).slice(0,3);
        qs.push({ty:'kw',d,clue:plain(d.yl.replace('=='+k+'==','【　？　】')),q:`「${d.t}」：空里填什么？`,kopts:shuffle([k,...alt]),ans:k})}}}});
  return qs}
function enterQuiz(){setPlay(false);clearTimeout(timer);quiz.on=true;$('#tQuiz').setAttribute('aria-pressed','true');$('#app').classList.add('quizzing');intro()}
function quitQuiz(){quiz.on=false;$('#tQuiz').setAttribute('aria-pressed','false');$('#app').classList.remove('quizzing');load(st.cur,{auto:false})}
$('#tQuiz').onclick=()=>quiz.on?quitQuiz():enterQuiz();
function intro(){$('#card').className='card';$('#card').innerHTML=`<div class="qz"><div class="qt">原理闯关</div><div class="qq">10 道题：看成语认原理、看方法论认原理、关键词填空</div>
  <p>出题范围：<b style="color:var(--gold)">${LVB[st.minLv]}</b>（${D.filter(visible).length} 个原理）。每答一题，左边会播放这个原理的动画。答错的进错题本。</p>
  <div class="row"><button class="btn pri" id="qGo">开始闯关</button><button class="btn" id="qWk" ${WEAK.size>=1?'':'disabled'}>只练错题（${WEAK.size}）</button></div><div class="row"><button class="btn" id="qQ">退出</button></div></div>`;
  $('#qGo').onclick=()=>start(D.filter(visible));$('#qWk').onclick=()=>start(D.filter(d=>WEAK.has(d.t)));$('#qQ').onclick=quitQuiz}
function start(pool){Object.assign(quiz,{qs:makeQs(pool),i:0,score:0,wrong:[]});showQ()}
function showQ(){const qn=quiz.qs[quiz.i],n=quiz.qs.length;quiz.done=false;
  sv.innerHTML=DEFS+`<text class="end" x="400" y="200" font-size="64">？</text><text class="t2" x="400" y="262" font-size="16">答完这题，这里播放对应的原理动画</text>`;$('#chn').textContent='闯关测验';$('#ttl').textContent=`第 ${quiz.i+1} 题`;$('#lvt').textContent='';$('#lvt').className='';$('#cap').innerHTML=`<span>得分 ${quiz.score}</span>`;$('#dots').innerHTML='';
  const opts=qn.ty==='kw'?qn.kopts.map((k,i)=>`<button class="opt" data-v="${esc(k)}"><span class="n">${i+1}</span>${esc(k)}</button>`):qn.opts.map((d,i)=>`<button class="opt" data-v="${d.id}"><span class="n">${i+1}</span>${esc(d.t)}</button>`);
  $('#card').innerHTML=`<div class="qz"><div class="qh"><span>第 <b>${quiz.i+1}</b> / ${n} 题</span><span>得分 <b>${quiz.score}</b></span></div><div class="bar"><i style="width:${quiz.i/n*100}%"></i></div>
  <div class="qt">${{ex:'例子 → 原理',ff:'方法论 → 原理',kw:'关键词填空'}[qn.ty]}</div><div class="qq">${esc(qn.q)}</div><div class="clue">${esc(qn.clue)}</div><div class="opts">${opts.join('')}</div><div id="qfb"></div></div>`;$('#card').scrollTop=0;
  document.querySelectorAll('.qz .opt').forEach(b=>b.onclick=()=>{if(quiz.done)return;quiz.done=true;const right=qn.ty==='kw'?qn.ans:String(qn.d.id),ok=b.dataset.v===right;
    document.querySelectorAll('.qz .opt').forEach(x=>{if(x.dataset.v===right)x.classList.add('ok');else if(x===b)x.classList.add('bad')});
    if(ok){quiz.score++;WEAK.delete(qn.d.t)}else{WEAK.add(qn.d.t);quiz.wrong.push(qn.d)}sv_('my.weak',WEAK);
    const d=qn.d;scene=T[d.a.type](d.a);sv.innerHTML=DEFS+scene.svg;$('#ttl').textContent=d.t;$('#chn').textContent=CH[d.ch];$('#dots').innerHTML='<i></i>'.repeat(scene.caps.length);setStep(0);autoStep();
    const last=quiz.i>=n-1;$('#qfb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b class="v">${ok?'✓ 答对了':'✗ 记一下'}</b><b>${esc(d.t)}</b><br>${fmt(d.yl)}</div><div class="row"><button class="btn pri" id="qN">${last?'看成绩':'下一题'}</button></div>`;
    $('#qN').onclick=()=>{clearTimeout(timer);if(last)endQ();else{quiz.i++;showQ()}}})}
function endQ(){const n=quiz.qs.length,s=quiz.score,W=[...new Set(quiz.wrong)];$('#ttl').textContent='闯关完成';$('#cap').innerHTML='';
  $('#card').innerHTML=`<div class="qz"><div class="qt">闯关完成</div><div class="big" style="margin:12px 0 6px">${s}<small> / ${n}</small></div>
  <p>${s/n>=.9?'很扎实，可以换成“全部原理”再来一轮。':s/n>=.6?'基本掌握，把下面的错题动画再看一遍。':'先开“连播”把这一章完整看一遍，再回来闯关。'}</p>
  ${W.length?`<div class="sec"><h3 class="r">这轮答错的</h3><div class="list">${W.map(d=>`<button data-qid="${d.id}">${esc(CH[d.ch])} · ${esc(d.t)}</button>`).join('')}</div></div>`:''}
  <div class="row"><button class="btn pri" id="qA">再来一轮</button><button class="btn" id="qWk" ${WEAK.size?'':'disabled'}>练错题本（${WEAK.size}）</button></div><div class="row"><button class="btn" id="qQ">退出闯关</button></div></div>`;
  $('#qA').onclick=()=>start(D.filter(visible));$('#qWk').onclick=()=>start(D.filter(d=>WEAK.has(d.t)));$('#qQ').onclick=quitQuiz;
  document.querySelectorAll('[data-qid]').forEach(b=>b.onclick=()=>{st.cur=+b.dataset.qid;quitQuiz();autoStep()})}

/* 启动 */
paintLv();buildNav();let s0=D.findIndex(d=>d.t==='物质与意识的辩证关系');
try{const t=localStorage.getItem('my.cur'),i=D.findIndex(d=>d.t===t);if(i>=0&&visible(D[i]))s0=i}catch(e){}
if(!visible(D[s0]))s0=D.find(visible).id;load(s0);
</script>
